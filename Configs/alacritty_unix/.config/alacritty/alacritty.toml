[general]
import = ["./themes/catppuccin-mocha.toml"]

[font]
size = 12.0
normal = { family = "Cascadia Mono NF", style = "Regular" }
bold = { family = "Cascadia Mono NF", style = "Bold" }
italic = { family = "Cascadia Mono NF", style = "Italic" }

[window]
decorations = "none"
opacity = 0.95

[window.dimensions]
columns = 120
lines = 36

[window.padding]
x = 12
y = 12
